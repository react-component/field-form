name: React Doctor

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2
